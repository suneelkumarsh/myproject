<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>T-NAP Portal</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/x-icon"
      href="assets/images/telekom_icon.ico" />
    <link rel="stylesheet" href="assets/css/bootstrap.css" />
    <link rel="stylesheet" href="styles.css" />
    <script src="assets/js/jquery-2.1.3.min.js"></script>
    <script src="assets/js/bootstrap.min.js"></script>
    <style>
      @font-face {
        font-family: TeleNeoWeb;
        src: url(./assets/fonts/TeleNeoWeb-Medium.woff);
      }

      body {
        overflow: hidden;
        font-family:
          TeleNeoWeb,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          'Helvetica Neue',
          Arial,
          sans-serif,
          'Apple Color Emoji',
          'Segoe UI Emoji',
          'Segoe UI Symbol';
      }

      .wrapper {
        padding: 6px;
      }

      .sidebar-container {
        margin-right: -1px;
        flex: 0 0 230px;
        border-right-style: solid;
        border-right-width: 1px;
        border-right-color: #b2b2b2;
      }

      .sidebar-expanded {
        min-width: 250px;
        max-width: 250px;
        height: calc(100vh - 67px);
        border-right-style: solid;
        border-right-width: 1px;
        border-right-color: #c5c5c5;
      }

      .telekom-logo {
        margin-left: 0.75rem;
        margin-bottom: 2px;
      }

      .navbar {
        background-color: #e20074;
        height: 55px;
        padding: 6px !important;
      }

      .sidebar-toggler {
        color: white;
        background-color: transparent;
        border-style: none;
        margin-top: 2px;
      }

      .btn-account {
        color: white;
        background-color: transparent;
        border-style: none;
        font-size: 21px;
        cursor: none;
        margin-bottom: 7px;
        height: 38.25px;
        padding-top: 3px;
        padding-bottom: 6.73px;
      }

      .btn:focus {
        outline: 0;
        box-shadow: none;
      }

      .error-content-wrapper {
        color: #e20074;
      }

      .error-text-wrapper {
        font-weight: bold;
      }

      .error-text-1 {
        font-size: 25px;
      }

      .error-text-2 {
        font-size: 20px;
        display: block !important;
      }

      .btn-fullscreen {
        width: 20px;
        margin-bottom: 8px;
      }

      .margin-r-6-px {
        margin-right: 6px;
      }

      .margin-l-auto {
        margin-left: auto;
      }

      .text-color {
        color: #212529 !important;
      }
    </style>
  </head>

  <body onload="errorInfo()">
    <div>
      <nav aria-label="Sidemenu" class="navbar navbar-light">
        <button
          type="button"
          class="sidebar-toggler"
          [attr.aria-label]="'Toggle sidemenu'">
          <img src="assets/images/icons/list.svg" alt="List" />
        </button>
        <a class="telekom-logo">
          <img
            src="assets/images/deutsche-telekom-logo.svg"
            alt="Telekom Logo" />
        </a>
        <div class="d-inline-block margin-r-6-px margin-l-auto">
          <button
            class="btn btn-invisible btn-fullscreen p-0 pointer"
            [attr.aria-label]="'Fullscreen'">
            <img
              src="assets/images/icons/arrows-fullscreen.svg"
              alt="Fullscreen" /></button
          ><!--
        -->
          <button class="btn btn-account px-4" [attr.aria-label]="'My Account'">
            <img src="assets/images/icons/person-fill.svg" alt="Person" /><!--
            --><img
              src="assets/images/icons/caret-down-fill.svg"
              alt="Caret down" />
          </button>
        </div>
      </nav>
    </div>
    <div class="wrapper d-flex">
      <div
        class="sidebar-container sidebar-expanded overflow-auto d-flex flex-column justify-content-between"
        [attr.aria-label]="'Main Menu'"></div>

      <div class="m-auto text-center error-content-wrapper">
        <div class="error-text-wrapper mt-auto">
          <p class="error-text-1">
            We are not able to authorize you due to a server issue that occurred
            at:
            <span id="dateTime"></span>
          </p>
          <p class="error-text-2">Please contact a support.</p>
          <div class="mt-5">
            <p>
              <span>Timestamp:</span>
              <span id="dateTimeLogFormat" class="text-color"></span>
            </p>
            <p>
              <span>Browser:</span>
              <span id="browserName" class="text-color"></span>
            </p>
            <p>
              <span>Browser version:</span>
              <span id="browserVersion" class="text-color"></span>
            </p>
          </div>
        </div>
      </div>
    </div>

    <script>
      const timestamp = getFormattedTimestamp();
      const dt = new Date();
      const browser = getBrowserInfo();

      function errorInfo() {
        document.getElementById('dateTime').innerHTML = dt.toLocaleString();
        document.getElementById('dateTimeLogFormat').innerHTML = timestamp;
        document.getElementById('browserName').innerHTML = browser.browserName;
        document.getElementById('browserVersion').innerHTML =
          browser.browserVersion;
      }

      function getBrowserInfo() {
        const userAgent = navigator.userAgent;
        let browserName = 'Unknown';
        let browserVersion = 'Unknown';

        if (
          /chrome|crios|crmo/i.test(userAgent) &&
          !/edge|edg|opr|opera/i.test(userAgent)
        ) {
          browserName = 'Chrome';
          browserVersion = userAgent.match(/Chrome\/([\d.]+)/)?.[1];
        } else if (/firefox|fxios/i.test(userAgent)) {
          browserName = 'Firefox';
          browserVersion = userAgent.match(/Firefox\/([\d.]+)/)?.[1];
        } else if (
          /safari/i.test(userAgent) &&
          !/chrome|crios|crmo|android/i.test(userAgent)
        ) {
          browserName = 'Safari';
          browserVersion = userAgent.match(/Version\/([\d.]+)/)?.[1];
        } else if (/edg/i.test(userAgent)) {
          browserName = 'Edge';
          browserVersion = userAgent.match(/Edg\/([\d.]+)/)?.[1];
        } else if (/opr|opera/i.test(userAgent)) {
          browserName = 'Opera';
          browserVersion = userAgent.match(/(Opera|OPR)\/([\d.]+)/)?.[2];
        } else if (/msie|trident/i.test(userAgent)) {
          browserName = 'Internet Explorer';
          browserVersion = userAgent.match(/(MSIE |rv:)(\d+\.\d+)/)?.[2];
        }
        return { browserName, browserVersion };
      }

      function getFormattedTimestamp() {
        const dtLogFormat = new Date();

        // This helper function converts a number to a string and adds leading zeros so that the result has at least size digits.
        //For example:
        //pad(5) → '05'
        //pad(9, 3) → '009'
        const pad = (num, size = 2) => String(num).padStart(size, '0');

        const year = dtLogFormat.getFullYear();
        const month = pad(dtLogFormat.getMonth() + 1);
        const day = pad(dtLogFormat.getDate());
        const hours = pad(dtLogFormat.getHours());
        const minutes = pad(dtLogFormat.getMinutes());
        const seconds = pad(dtLogFormat.getSeconds());
        const milliseconds = pad(dtLogFormat.getMilliseconds(), 3);

        return `${year}-${month}-${day} ${hours}:${minutes}:${seconds},${milliseconds}`;
      }
    </script>
  </body>
</html>
